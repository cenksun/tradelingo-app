name: tradepath
description: "TradePath - an offline-first, gamified trading education app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.2
  meta: ^1.16.0
  path: ^1.9.0
  path_provider: ^2.1.5
  sqlite3: ^3.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/
    - assets/market_data/

